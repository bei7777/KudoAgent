name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: .runtime/package-check/bin/python
          - os: macos-latest
            python: .runtime/package-check/bin/python
          - os: windows-latest
            python: .runtime/package-check/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TMPDIR: ${{ github.workspace }}/.runtime/tmp
      UV_CACHE_DIR: ${{ github.workspace }}/.runtime/uv-cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: false
      - run: mkdir -p .runtime/tmp
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: '3.12'
          enable-cache: true
          cache-local-path: ${{ github.workspace }}/.runtime/uv-cache
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests scripts
      - run: uv run --locked pytest -m 'not live'
      - run: uv build
      - run: uv venv --python 3.12 .runtime/package-check
      - run: uv pip install --python '${{ matrix.python }}' dist/*.whl
      - run: "'${{ matrix.python }}' scripts/verify_install.py .runtime/install-check"
